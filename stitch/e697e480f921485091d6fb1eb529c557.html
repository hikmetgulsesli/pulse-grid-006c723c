<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Post-Game Results</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary": "#4ae176",
                        "outline": "#87929a",
                        "primary-fixed-dim": "#7bd0ff",
                        "on-primary-container": "#004965",
                        "outline-variant": "#3e484f",
                        "on-surface-variant": "#bdc8d1",
                        "on-primary-fixed-variant": "#004c69",
                        "inverse-surface": "#dae2fd",
                        "on-error-container": "#ffdad6",
                        "primary-fixed": "#c4e7ff",
                        "surface-container-high": "#222a3d",
                        "on-tertiary-fixed-variant": "#2f3aa3",
                        "on-secondary-container": "#004119",
                        "secondary-fixed-dim": "#4ae176",
                        "on-tertiary-container": "#2c37a0",
                        "on-surface": "#dae2fd",
                        "secondary-fixed": "#6bff8f",
                        "tertiary": "#c5c9ff",
                        "tertiary-fixed": "#e0e0ff",
                        "on-secondary-fixed-variant": "#005321",
                        "surface-container": "#171f33",
                        "surface-tint": "#7bd0ff",
                        "primary": "#8ed5ff",
                        "surface-container-highest": "#2d3449",
                        "tertiary-fixed-dim": "#bdc2ff",
                        "on-error": "#690005",
                        "tertiary-container": "#a3abff",
                        "on-primary-fixed": "#001e2c",
                        "on-secondary": "#003915",
                        "background": "#0b1326",
                        "on-tertiary-fixed": "#000767",
                        "surface-container-lowest": "#060e20",
                        "secondary-container": "#00b954",
                        "error": "#ffb4ab",
                        "on-primary": "#00354a",
                        "error-container": "#93000a",
                        "on-tertiary": "#131e8c",
                        "surface-dim": "#0b1326",
                        "surface-bright": "#31394d",
                        "surface-variant": "#2d3449",
                        "inverse-on-surface": "#283044",
                        "primary-container": "#38bdf8",
                        "surface-container-low": "#131b2e",
                        "on-background": "#dae2fd",
                        "surface": "#0b1326",
                        "inverse-primary": "#00668a",
                        "on-secondary-fixed": "#002109"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "xs": "4px",
                        "margin-mobile": "16px",
                        "xl": "48px",
                        "md": "16px",
                        "base": "4px",
                        "margin-desktop": "32px",
                        "lg": "24px",
                        "gutter": "16px",
                        "sm": "8px"
                    },
                    "fontFamily": {
                        "label-mono": ["JetBrains Mono"],
                        "headline-lg-mobile": ["Geist"],
                        "headline-xl": ["Geist"],
                        "body-md": ["Geist"],
                        "headline-lg": ["Geist"],
                        "data-display": ["JetBrains Mono"],
                        "body-sm": ["Geist"]
                    },
                    "fontSize": {
                        "label-mono": ["12px", { "lineHeight": "1.4", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "headline-xl": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "data-display": ["18px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .scanline-effect:hover {
            background-image: linear-gradient(0deg, transparent 50%, rgba(255, 180, 171, 0.1) 50%);
            background-size: 100% 4px;
        }
        .pulse-border {
            box-shadow: 0 0 12px rgba(255, 180, 171, 0.1);
        }
    </style>
</head>
<body class="bg-surface-container-lowest text-on-surface font-body-md antialiased min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-error-container/20 via-surface-container-lowest to-surface-container-lowest pointer-events-none z-0"></div>
<div class="absolute inset-0 opacity-[0.03] bg-[linear-gradient(to_right,#87929a_1px,transparent_1px),linear-gradient(to_bottom,#87929a_1px,transparent_1px)] bg-[size:16px_16px] z-0 pointer-events-none"></div>
<main class="relative z-10 w-full max-w-[800px] px-margin-mobile md:px-margin-desktop py-xl flex flex-col items-center">
<div class="w-full bg-surface-container/90 backdrop-blur-xl border border-error/30 p-lg md:p-xl flex flex-col items-center text-center pulse-border rounded-none relative">
<div class="absolute top-0 left-0 w-2 h-2 bg-error"></div>
<div class="absolute bottom-0 right-0 w-2 h-2 bg-error"></div>
<div class="mb-lg animate-pulse">
<span class="material-symbols-outlined text-[64px] text-error" style="font-variation-settings: 'FILL' 1;">warning</span>
</div>
<h1 class="font-headline-xl text-headline-xl text-error mb-sm uppercase tracking-widest drop-shadow-[0_0_8px_rgba(255,180,171,0.5)]">SIGNAL LOST</h1>
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface-variant mb-xl uppercase tracking-wider">GRID INTEGRITY COMPROMISED</h2>
<div class="w-full grid grid-cols-1 md:grid-cols-3 gap-md mb-xl">
<div class="bg-surface-container-highest/80 border border-outline-variant/50 p-md flex flex-col items-center justify-center relative overflow-hidden group">
<div class="absolute inset-0 bg-error/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="font-label-mono text-label-mono text-outline uppercase mb-sm z-10">FINAL SCORE</span>
<span class="font-data-display text-data-display text-on-surface z-10">24,590</span>
</div>
<div class="bg-surface-container-highest/80 border border-outline-variant/50 p-md flex flex-col items-center justify-center relative overflow-hidden group">
<div class="absolute inset-0 bg-error/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="font-label-mono text-label-mono text-outline uppercase mb-sm z-10">LEVELS CLEARED</span>
<span class="font-data-display text-data-display text-on-surface z-10">14</span>
</div>
<div class="bg-error-container/20 border border-error/40 p-md flex flex-col items-center justify-center relative overflow-hidden group">
<div class="absolute inset-0 bg-error/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="font-label-mono text-label-mono text-error uppercase mb-sm z-10">EFFICIENCY</span>
<span class="font-data-display text-data-display text-error z-10">78%</span>
</div>
</div>
<div class="flex flex-col w-full md:flex-row gap-md justify-center mt-sm">
<button class="bg-error text-on-error font-label-mono text-label-mono px-xl py-lg uppercase hover:bg-error/90 hover:shadow-[0_0_16px_rgba(255,180,171,0.4)] transition-all border border-error relative overflow-hidden scanline-effect flex items-center justify-center gap-sm">
<span class="material-symbols-outlined">restart_alt</span>
                    REBOOT SEQUENCE
                </button>
<button class="bg-transparent text-error border border-error/50 font-label-mono text-label-mono px-xl py-lg uppercase hover:bg-error/10 transition-all flex items-center justify-center gap-sm">
<span class="material-symbols-outlined">power_settings_new</span>
                    DISCONNECT
                </button>
</div>
</div>
</main>
</body></html>
